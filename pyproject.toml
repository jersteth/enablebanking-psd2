[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "be-enablebanking-demo"
version = "0.1.0"
description = "End-to-end PSD2 demo: Belgian personal account transactions via Enable Banking"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyJWT[crypto]>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "jsonschema>=4.18"]

[project.scripts]
psd2-demo = "psd2demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/psd2demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
