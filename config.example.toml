# Copy to config.toml (git-ignored) and fill in.
# Precedence: CLI flag > environment variable > this file > default.

# Account used when a command gets no --account. TOML rule: top-level keys like this one must come
# BEFORE the first [section], otherwise they belong to that section.
default_account = "main"

[enablebanking]
# Application ID from the Enable Banking control panel (= file name of the downloaded .pem).
# env EB_APP_ID, flag --app-id
app_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"

# Path to the private key downloaded at registration. Keep it outside the repo, chmod 600.
# env EB_KEY_PATH, flag --key
key_path = "~/.config/psd2demo/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.pem"

# Redirect URL; must be whitelisted on the application exactly as written here.
# https://... -> paste mode; http://localhost:<port>/... -> automatic capture (if Enable Banking accepts it).
# env EB_REDIRECT_URL, flag --redirect-url
redirect_url = "https://localhost/callback"

# Your public IP (curl -s https://ifconfig.me), sent as Psu-Ip-Address. Many banks require it:
# Enable Banking accepts all of a bank's required PSU headers or none. Without it the demo sends none
# (unattended access, which banks may cap at 4 requests per day). env EB_PSU_IP, flag --psu-ip
# psu_ip_address = "203.0.113.10"

# Accounts: one table per account. The name after "accounts." is what --account takes.
# bank_name must be the exact Enable Banking name (`psd2-demo banks --filter <text>` lists them).
# Each must be linked to the application in the control panel.
[accounts.main]
bank_name = "KBC"
iban = "BE68 5390 0754 7034"
# bank_country = "BE"          # default BE

# [accounts.savings]
# bank_name = "KBC"            # same bank as main: one consent covers both
# iban = "BE71 0961 2345 6769"

# The 002 single-account form still works and becomes the account named "demo":
# [demo]
# bank_name = "KBC"
# iban = "BE68 5390 0754 7034"
# Ad hoc, without config: --bank KBC --iban BE68... (or env EB_BANK_NAME + EB_IBAN) overrides the selection.

[demo]
# Consent settings (the section name is kept from 002).
# auto | paste | listener. env EB_CAPTURE_MODE, flag --capture (default auto)
capture_mode = "auto"

# Requested consent validity in days, capped by the bank's maximum.
# env EB_CONSENT_DAYS, flag --consent-days (default 1)
consent_days = 1

# Seconds to wait for the bank redirect. env EB_CALLBACK_TIMEOUT, flag --callback-timeout (default 300)
callback_timeout = 300

# Defaults for `psd2-demo history` and psd2demo.history.fetch_history() (documentation/account-history.md).
[history]
days = 30              # period when no --days/--from is given; env EB_HISTORY_DAYS
include = []           # extra parts: "balances", "details", "raw" (each costs bank requests);
                       # env EB_HISTORY_INCLUDE (comma-separated); --include replaces it
max_age = 60           # minutes a cached account result is reused (protects the 4/day unattended limit);
                       # env EB_HISTORY_MAX_AGE; --no-cache bypasses the cache
